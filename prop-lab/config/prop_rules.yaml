# Regole prop PARAMETRICHE (modelli generici, NON il regolamento ufficiale di una firm).
# ⚠️ Prima di usare un risultato, aggiorna questi valori col regolamento attuale della tua prop.
#
# daily_basis:     day_start = limite calcolato dal saldo di inizio giornata
#                  initial   = limite fisso rispetto al saldo iniziale
# max_loss_type:   static | trailing (segue il picco intraday a trade chiuso) | trailing_eod (picco a fine giorno)
# trailing_lock:   il trailing si ferma al saldo iniziale
# consistency_pct: miglior giorno <= X% del profitto totale per passare (null = nessuna regola)
# max_days:        limite di giorni di calendario di trading per fase (null = illimitato -> max_days_default)
# funded:          simulazione dopo il passaggio: giorni, split, payout ogni N giorni, rimborso fee

two_step_classic:
  description: "2 fasi 10%/5%, daily 5% da inizio giornata, max 10% statico"
  account: 100000
  fee: 540
  daily_loss_pct: 5
  daily_basis: day_start
  max_loss_pct: 10
  max_loss_type: static
  phases:
    - {name: fase1, target_pct: 10, min_days: 4, max_days: null}
    - {name: fase2, target_pct: 5, min_days: 4, max_days: null}
  max_days_default: 120
  funded: {days: 120, split_pct: 80, payout_every: 20, refund_fee: true}

two_step_tight:
  description: "2 fasi 8%/5%, daily 4%, max 8% statico"
  account: 100000
  fee: 500
  daily_loss_pct: 4
  daily_basis: day_start
  max_loss_pct: 8
  max_loss_type: static
  phases:
    - {name: fase1, target_pct: 8, min_days: 3, max_days: null}
    - {name: fase2, target_pct: 5, min_days: 3, max_days: null}
  max_days_default: 120
  funded: {days: 120, split_pct: 80, payout_every: 20, refund_fee: true}

one_step_trailing:
  description: "1 fase 10%, daily 3%, max 6% trailing (lock al saldo iniziale), consistency 50%"
  account: 100000
  fee: 600
  daily_loss_pct: 3
  daily_basis: day_start
  max_loss_pct: 6
  max_loss_type: trailing
  trailing_lock: true
  consistency_pct: 50
  phases:
    - {name: fase1, target_pct: 10, min_days: 3, max_days: null}
  max_days_default: 120
  funded: {days: 120, split_pct: 80, payout_every: 20, refund_fee: false}


# =====================================================================================================
# REGOLAMENTI VERI DELLE FIRM — Comet, due passaggi (06/10). Fonte integrale:
#   docs/reviews/prop_regolamenti_comet_2026-10-06.md (trad)
# Stato `citato_senza_url`: ogni valore ha una frase citata e il nome della pagina, ma non l'URL. Utilizzabile per
# orientarsi, non per una decisione con soldi. I campi ambigui o contraddittori fra i due passaggi restano null,
# con il motivo e i valori di Comet accanto (`comet_*`): lab.prop.regole_mancanti() li elenca ed evaluate() rifiuta.
# Campi che il simulatore NON modella (news, weekend, EA, leva, consistency nel funded): solo documentazione.
# `funded.days` e `max_days_default` NON sono regole della firm: sono il nostro orizzonte di simulazione.
# Giorno di trading: FTMO azzera alle 00:00 CE(S)T; il simulatore usa i giorni dell'orario server dei dati
# (spesso EET = CE(S)T + 1h). Differenza di un'ora sul confine della giornata: piccola, ma dichiarata.
# =====================================================================================================

ftmo_2step:
  description: "FTMO Challenge 2 fasi, 100k"
  fonte: "Comet 06/10, FTMO Trading Objectives / FAQ (frasi citate, URL non riportati)"
  stato: citato_senza_url
  account: 100000
  fee: null                         # NON_TROVATO da Comet (FTMO lo pubblica: da prendere dalla pagina prezzi)
  daily_loss_pct: 5                 # "5% of the Initial Simulated Capital"
  daily_basis: day_start            # "account balance recorded at 00:00 CE(S)T": soglia = saldo delle 00:00 - 5% del capitale iniziale
  comet_daily_includes_floating: true   # "Equity (Balance + Open Positions P/L ± Swaps – Commissions)"; il simulatore lo approssima con la MAE
  max_loss_pct: 10
  max_loss_type: static             # "a static limit"
  phases:
    - {name: fase1, target_pct: 10, min_days: 4, max_days: null}   # "No time limit"
    - {name: fase2, target_pct: 5, min_days: 4, max_days: null}
  max_days_default: 250             # la firm NON pone limite di tempo: orizzonte nostro di un anno di trading (con 120 il simulatore contava come fallimento un'attesa che FTMO non punisce)
  funded: {days: 120, split_pct: 80, payout_every: 14, refund_fee: true}   # 80% -> 90% con Reward Growth; payout dal giorno 14, accumulo libero
  note_non_simulate: "Standard funded: restrizioni overnight/weekend (la frase citata non distingue i due) e news ±2 min; Swing: nessuna restrizione, leva 1:30. EA consentiti, sorgente non richiesto. Leva Standard 1:100, per simbolo non pubblicata. Italia ammessa."

ftmo_1step:
  description: "FTMO Challenge 1 fase, 100k"
  fonte: "Comet 06/10, FTMO 1-Step / Trading Objectives (frasi citate, URL non riportati)"
  stato: citato_senza_url
  account: 100000
  fee: null                         # NON_TROVATO; fee non rimborsata
  daily_loss_pct: 3
  daily_basis: day_start
  comet_daily_includes_floating: true
  max_loss_pct: 10
  max_loss_type: trailing_eod       # "end-of-day trailing limit"
  trailing_lock: false
  consistency_pct: 50               # Best Day Rule: "Best Day … not … more than 50%" (citazione troncata). Nel 1o passaggio Comet diceva "nessuna"
  comet_consistency_window: account_lifetime
  phases:
    - {name: fase1, target_pct: 10, min_days: null, max_days: null}   # min_days: NON trovato in nessuno dei due passaggi
  max_days_default: 120             # limite di tempo NON trovato: orizzonte nostro, da rivedere
  funded: {days: 120, split_pct: 90, payout_every: 14, refund_fee: false}   # accumulo NON libero
  note_non_simulate: "Swing non disponibile per il 1-Step. News: come il 2-Step Standard."

fundednext_stellar_2step:
  description: "FundedNext Stellar 2-Step CFD, 100k"
