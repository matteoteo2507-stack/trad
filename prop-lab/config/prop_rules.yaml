  daily_loss_pct: 5                 # "must not lose more than 5% of the initial balance in a single day"
  daily_basis: null                 # AMBIGUO: base = saldo iniziale, ma il livello da cui si misura non e' citato
  comet_daily_basis: "initial_balance - 5% (deduzione di Comet, non citazione: 'in a single day' punta a un riferimento giornaliero; reset NON_TROVATO)"
  comet_daily_includes_floating: true
  max_loss_pct: 10                  # "must not drop below 90% of its initial balance"
  max_loss_type: static
  consistency_pct: null             # CONTRADDIZIONE: 40% dall'ultimo payout nel 1o passaggio, DA_VERIFICARE nel 2o
  phases:
    - {name: fase1, target_pct: 8, min_days: 5, max_days: null}   # "8% in Phase 1", "at least 5 different days", "no time limit"
    - {name: fase2, target_pct: 5, min_days: 5, max_days: null}
  max_days_default: 250             # "no time limit": orizzonte nostro di un anno di trading
  funded: {days: 120, split_pct: 80, payout_every: 21, refund_fee: null}   # primo ciclo 21 giorni; la frequenza dopo dipende dall'opzione scelta
  note_non_simulate: "EA: sotto 50k consentiti con costo aggiuntivo, da 50k in su SOLO MANUALE; vietati gli EA fatti per passare le challenge. News funded: ±5 min, conta solo il 40% del profitto, perdite piene. Italia ammessa."

