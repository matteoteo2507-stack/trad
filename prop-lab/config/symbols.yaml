# Specifiche dei simboli = COSTI del broker/prop.
# ⚠️ Valori di ESEMPIO: copia i tuoi da MT5 (tasto destro sul simbolo -> Specifiche)
#   point                 dimensione del point (es. XAUUSD 0.01, EURUSD 0.00001)
#   contract_size         dimensione contratto per 1 lotto
#   spread_points         spread tipico in points (usato se il CSV non ha la colonna <SPREAD>)
#   min_spread_frac       lo spread per barra del CSV non scende sotto frac*spread_points
#   spread_mult           stress test (es. 1.5 = spread +50%)
#   commission_per_lot_rt commissione andata+ritorno per lotto, in valuta di quotazione
#   slippage_points       slippage stimato per lato
#   swap_long/short_points swap per notte in points (negativo = paghi)
#   triple_swap_dow       giorno della tripla (0=lun ... 2=mer, 4=ven)

XAUUSD:
  point: 0.01
  contract_size: 100
  spread_points: 25
  min_spread_frac: 0.5
  spread_mult: 1.0
  commission_per_lot_rt: 7.0
  slippage_points: 5
  swap_long_points: -45
  swap_short_points: 20
  triple_swap_dow: 2

